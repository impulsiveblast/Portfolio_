<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brahamjeet Anand | Full Stack Software Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#14141f;--mute:#5d5d73;--line:#e4e4ef;--acc:#6c5ce7;--acc2:#a29bfe;--glow:rgba(108,92,231,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c14;--card:#14141f;--ink:#f1f1f8;--mute:#9a9ab3;--line:#26263a;--acc:#8b7cf6;--acc2:#b9b0ff;--glow:rgba(139,124,246,.16)}}
:root[data-theme="dark"]{--bg:#0c0c14;--card:#14141f;--ink:#f1f1f8;--mute:#9a9ab3;--line:#26263a;--acc:#8b7cf6;--acc2:#b9b0ff;--glow:rgba(139,124,246,.16)}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 80% 0%,var(--glow),transparent),radial-gradient(40% 30% at 0% 60%,var(--glow),transparent);pointer-events:none;z-index:-1}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
section{padding:80px 0}
.eyebrow{color:var(--acc);font:600 13px/1 Inter;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:30px}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:20;width:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.logo{font:700 19px "Space Grotesk"}.logo b{color:var(--acc)}
.links{display:flex;gap:6px;font-size:14px;color:var(--mute)}
.links a{padding:6px 12px;border-radius:99px;transition:.2s}
.links a:hover{color:var(--ink)}
.links a.on{color:var(--acc);background:var(--glow)}
.right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font:600 14px Inter;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--ink);transition:.2s}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.1)}
.ico{padding:10px 12px}
.menu{display:none}
.hero{padding:70px 0 30px}
.hero .wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);border:1px solid var(--line);padding:6px 14px;border-radius:99px;margin-bottom:22px;background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.2)}
h1{font-size:clamp(34px,6vw,60px);line-height:1.06;margin-bottom:20px}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.caret{display:inline-block;width:3px;height:.9em;background:var(--acc);margin-left:3px;vertical-align:-.08em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.lead{color:var(--mute);font-size:18px;max-width:560px;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.photo{justify-self:center}
.avatar{width:min(300px,70vw);aspect-ratio:1;border-radius:28px;border:1px solid var(--line);display:grid;place-items:center;font:700 84px "Space Grotesk";color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 20px 60px var(--glow);transition:transform .15s}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:50px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.num{font-size:34px;font-weight:700;color:var(--acc);line-height:1}
.stat p{color:var(--mute);font-size:13px;margin-top:8px}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}
.about p{color:var(--mute);margin-bottom:16px}.about p b{color:var(--ink);font-weight:600}
.phil{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.phil h3{font-size:17px;margin-bottom:12px}
.phil li{list-style:none;padding:9px 0;border-top:1px solid var(--line);color:var(--mute);font-size:15px;cursor:default;transition:.2s}
.phil li:first-of-type{border:0}.phil li:hover{padding-left:8px;color:var(--ink)}.phil li b{color:var(--ink)}
.search{max-width:320px;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.sk h3{font-size:15px;color:var(--acc);margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--glow);border:1px solid var(--line);color:var(--ink)}
button.tag{cursor:pointer;transition:.2s}
button.tag:hover,.tag.on{border-color:var(--acc);color:var(--acc)}
.tag.dim{opacity:.25}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:600 13px Inter;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.proj{display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;transition:.25s;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card:hover{border-color:var(--acc);transform:translateY(-3px)}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.card h3{font-size:24px}.card small{color:var(--mute);font-size:13px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{padding:8px 14px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:700 12px Inter;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:.2s}
.tabs button.on{background:var(--glow);border-color:var(--acc);color:var(--acc)}
.pane{border-left:2px solid var(--acc);padding-left:14px;color:var(--mute);margin-bottom:18px;min-height:56px}
.pane strong{color:var(--ink)}
.tl{position:relative;padding-left:28px;border-left:1px solid var(--line);display:grid;gap:22px}
.job{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;cursor:pointer;transition:.2s}
.job:hover{border-color:var(--acc)}
.job:before{content:"";position:absolute;left:-36px;top:26px;width:13px;height:13px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px var(--glow)}
.job .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.job h3{font-size:19px}.job .meta{color:var(--mute);font-size:14px}
.job .chev{transition:.25s;color:var(--acc)}.job.open .chev{transform:rotate(180deg)}
.job ul{padding-left:18px;color:var(--mute);font-size:15px;display:grid;gap:8px;margin-top:14px}
.job li b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
.box h3{font-size:17px;margin-bottom:16px;color:var(--acc)}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border:0;padding-top:0}
.item b{display:block;font-weight:600}.item span{color:var(--mute);font-size:14px}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
.contact p{color:var(--mute);margin-bottom:20px}
.soc{display:flex;gap:10px;margin-top:22px}
.soc a{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);transition:.2s}
.soc a:hover{border-color:var(--acc);color:var(--acc)}
.soc svg{width:20px;height:20px;fill:currentColor}
form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:120px;resize:vertical}
.hint{font-size:13px;color:var(--mute);min-height:18px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:13px;text-align:center}
.rv{opacity:0;transform:translateY(18px);transition:.6s}.rv.in{opacity:1;transform:none}
#top2{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;padding:0;z-index:9;background:var(--acc);color:#fff;border:0;cursor:pointer;font-size:18px;transition:.3s}
@media(max-width:860px){.hero .wrap,.about,.contact,.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 22px;border-bottom:1px solid var(--line)}.links.show{display:flex}.menu{display:inline-flex}.photo{order:-1}section{padding:56px 0}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,5,12,.72);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s both}
.mbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:#fff}
.mbar h3{font-size:18px}.mbar .row .btn{padding:9px 16px}
.mbody{width:100%;max-width:900px;overflow:auto;flex:1;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mbody img{width:100%;display:block}
.mnote{color:#cfcfe6;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
</style>
</head>
